[package]
name = "globipos-pda"
version = "0.1.0"
description = "GlobiPOS PDA Android companion"
authors = ["GlobiPOS"]
edition = "2021"
license = "UNLICENSED"

[lib]
name = "globipos_pda_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
