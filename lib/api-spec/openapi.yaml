openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /pos/terminals/{id}/heartbeat:
    post:
      operationId: terminalHeartbeat
      summary: Report terminal connectivity and aggregate sync observations
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: header
          name: X-Terminal-Code
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TerminalHeartbeatInput" }
      responses:
        "200":
          description: Report received; not a financial acknowledgement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TerminalHeartbeatReceipt" }
        "400": { description: Invalid bounded telemetry }
        "401": { description: Terminal authentication required }
        "403": { description: Terminal identity mismatch }
  /control/heartbeat:
    post:
      operationId: deploymentHeartbeat
      summary: Authenticated customer installation report to the master
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeploymentHeartbeatInput" }
      responses:
        "200":
          description: Report received
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeploymentHeartbeatReceipt" }
        "400": { description: Invalid telemetry }
        "401": { description: Deployment credential required }
        "403": { description: Suspended deployment }
  /control/deployments/{id}/device-sync:
    get:
      operationId: getDeploymentDeviceSync
      summary: Read redacted device telemetry for the selected deployment
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Last reported device states, not a live checkout guarantee
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeploymentDeviceSyncResponse" }
        "401": { description: Authentication required }
        "403": { description: Fleet superuser access required }
        "404": { description: Deployment not found }
  /customer-credit/{customerId}:
    parameters:
      - { name: customerId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getCustomerCredit
      summary: Get customer credit and approval history
      responses:
        "200":
          description: Credit account and history
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/CustomerCredit" }
                  - { type: object, properties: { history: { type: array, items: { type: object, additionalProperties: true } } } }
    put:
      operationId: approveCustomerCredit
      summary: Set credit approval, limit and terms (explicit approval permission required)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerCreditUpdate"
      responses:
        "200":
          description: Updated credit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerCredit" }
        "403": { description: Credit approval permission required }
  /pos/customer-invoices/customers:
    post:
      operationId: searchPosInvoiceCustomers
      summary: Find an invoice customer (paired terminal and live cashier authentication)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PosInvoiceSearch"
      responses:
        "200":
          description: Matching customers
          content:
            application/json:
              schema:
                type: object
                required: [customers]
                properties:
                  customers: { type: array, items: { $ref: "#/components/schemas/PosInvoiceCustomer" } }
  /pos/customer-invoices/quote:
    post:
      operationId: quotePosCustomerInvoice
      summary: Get authoritative prices and live credit; overdue balances warn but do not block
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PosInvoiceCart" }
      responses:
        "200":
          description: Quote to confirm before checkout
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PosInvoiceQuote" }
  /pos/customer-invoices/checkout:
    post:
      operationId: checkoutPosCustomerInvoice
      summary: Atomically issue one POS sale and one invoice; retry unchanged requests with the same orderId
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PosInvoiceCheckout"
      responses:
        "201":
          description: Completed invoice or matching replay
          content:
            application/json:
              schema:
                type: object
                required: [orderId, orderNumber, invoiceId, invoiceNumber, totalCents, changeDueCents, paymentMethod, deduplicated]
                properties:
                  orderId: { type: string }
                  posOrderId: { type: string }
                  orderNumber: { type: string }
                  invoiceId: { type: string }
                  invoiceNumber: { type: string }
                  totalCents: { type: integer }
                  changeDueCents: { type: integer }
                  paymentMethod: { type: string, enum: [cash, card, account_credit] }
                  deduplicated: { type: boolean }
        "409": { description: "Changed quote, insufficient stock, exceeded credit limit or checkout ID reuse" }
        "403": { description: "Device, cashier, layout or credit approval required" }
  /pos/customer-invoices/{invoiceId}/document:
    parameters:
      - { name: invoiceId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getPosInvoiceDocument
      summary: Printable existing invoice format, limited to the paired issuing terminal
      responses:
        "200":
          description: Printable HTML
          content:
            text/html:
              schema: { type: string }
  /pos/customer-invoices/{invoiceId}/email:
    parameters:
      - { name: invoiceId, in: path, required: true, schema: { type: string } }
    post:
      operationId: emailPosInvoiceDocument
      summary: Send the invoice to the customer's saved email address
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PosInvoiceAuth" }
      responses:
        "200":
          description: Email sent
          content:
            application/json:
              schema: { type: object, required: [sent], properties: { sent: { type: boolean } } }
components:
  schemas:
    CustomerCreditUpdate:
      type: object
      required: [approvalStatus, creditLimit, paymentTerms, reason]
      properties:
        approvalStatus: { type: string, enum: [pending, approved, suspended] }
        creditLimit: { type: string, pattern: '^\d{1,8}(?:\.\d{1,2})?$' }
        paymentTerms: { type: string, pattern: '^(cash|credit_(?:0|[1-9]\d{0,2}))$' }
        reason: { type: string, minLength: 1, maxLength: 500 }
    PosInvoiceSearch:
      allOf:
        - { $ref: "#/components/schemas/PosInvoiceAuth" }
        - { type: object, required: [search], properties: { search: { type: string, minLength: 1, maxLength: 100 } } }
    PosInvoiceCheckout:
      allOf:
        - { $ref: "#/components/schemas/PosInvoiceCart" }
        - type: object
          required: [orderId, expectedTotalCents, quoteHash, paymentMethod, amountTenderedCents]
          properties:
            orderId: { type: string, format: uuid }
            expectedTotalCents: { type: integer, minimum: 0, maximum: 100000000 }
            quoteHash: { type: string }
            paymentMethod: { type: string, enum: [cash, card, account_credit] }
            amountTenderedCents: { type: integer, minimum: 0, maximum: 100000000 }
            cardReference: { type: string, description: Reference of an already-approved external card payment; this endpoint does not charge a card }
    CustomerCredit:
      type: object
      required: [approvalStatus, limitCents, balanceCents, availableCents, paymentTerms, overdueCents, hasOverdue]
      properties:
        approvalStatus: { type: string, enum: [pending, approved, suspended] }
        limitCents: { type: integer }
        balanceCents: { type: integer }
        availableCents: { type: integer }
        paymentTerms: { type: string }
        overdueCents: { type: integer }
        hasOverdue: { type: boolean }
    PosInvoiceAuth:
      type: object
      required: [cashierId, pin]
      properties:
        cashierId: { type: string }
        pin: { type: string, pattern: '^\d{4,8}$' }
    PosInvoiceCustomer:
      type: object
      required: [id, name, code]
      properties:
        id: { type: string }
        name: { type: string }
        code: { type: string }
        priceLevel: { type: integer }
    PosInvoiceCart:
      allOf:
        - { $ref: "#/components/schemas/PosInvoiceAuth" }
        - type: object
          required: [customerId, mode, lines]
          properties:
            customerId: { type: string }
            mode: { type: string, enum: [retail, wholesale] }
            lines:
              type: array
              minItems: 1
              maxItems: 200
              items:
                type: object
                required: [itemId, quantity]
                properties:
                  itemId: { type: string }
                  variantId: { type: [string, "null"] }
                  quantity: { type: integer, minimum: 1, maximum: 10000 }
                  saleUnit: { type: string, enum: [pc, pack] }
    PosInvoiceQuote:
      type: object
      required: [customer, credit, lines, subtotalCents, vatCents, totalCents, quoteHash]
      properties:
        customer: { $ref: "#/components/schemas/PosInvoiceCustomer" }
        credit: { $ref: "#/components/schemas/CustomerCredit" }
        subtotalCents: { type: integer }
        vatCents: { type: integer }
        totalCents: { type: integer }
        quoteHash: { type: string }
        lines:
          type: array
          items:
            type: object
            required: [itemId, variantId, description, quantity, saleUnit, unitPrice, discountPercent, totalCents, vatCents, vatRate]
            properties:
              itemId: { type: string }
              variantId: { type: [string, "null"] }
              description: { type: string }
              quantity: { type: number }
              saleUnit: { type: string, enum: [pc, pack] }
              unitPrice: { type: number }
              discountPercent: { type: number }
              totalCents: { type: integer }
              vatCents: { type: integer }
              vatRate: { type: number }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    SyncCount:
      type: integer
      minimum: 0
      maximum: 1000000
    SyncTime:
      type: [string, "null"]
      maxLength: 40
      description: ISO 8601 device observation time; never the master's freshness clock
    PosSyncSnapshot:
      type: object
      required: [schemaVersion, platform, deviceId, sequence, phase, syncing, online, serverReachable, catalogReceived, catalogCommitted, catalogPages, transactionsConfirmed, auditsConfirmed, outboxPending, outboxFailed, auditPending, auditFailed]
      properties:
        schemaVersion: { type: integer, enum: [1] }
        platform: { type: string, enum: [pwa, native] }
        deviceId: { type: string, minLength: 1, maxLength: 80 }
        sequence: { type: integer, minimum: 1, maximum: 9007199254740991 }
        buildVersion: { type: [string, "null"], maxLength: 80 }
        runId: { type: [string, "null"], maxLength: 80 }
        phase:
          type: string
          enum: [idle, cashiers, catalog-download, catalog-save, transactions, audits, inbox, complete, failed, partial, interrupted]
        syncing: { type: boolean }
        online: { type: boolean }
        serverReachable: { type: [boolean, "null"] }
        lastAttemptAt: { $ref: "#/components/schemas/SyncTime" }
        startedAt: { $ref: "#/components/schemas/SyncTime" }
        progressAt: { $ref: "#/components/schemas/SyncTime" }
        lastServerContactAt: { $ref: "#/components/schemas/SyncTime" }
        lastCatalogSyncAt: { $ref: "#/components/schemas/SyncTime" }
        lastTransactionSyncAt: { $ref: "#/components/schemas/SyncTime" }
        lastSuccessAt: { $ref: "#/components/schemas/SyncTime" }
        retryAt: { $ref: "#/components/schemas/SyncTime" }
        error: { type: [string, "null"], maxLength: 240 }
        catalogReceived: { $ref: "#/components/schemas/SyncCount" }
        catalogCommitted: { $ref: "#/components/schemas/SyncCount" }
        catalogPages: { $ref: "#/components/schemas/SyncCount" }
        transactionsConfirmed: { $ref: "#/components/schemas/SyncCount" }
        auditsConfirmed: { $ref: "#/components/schemas/SyncCount" }
        outboxPending: { $ref: "#/components/schemas/SyncCount" }
        outboxFailed: { $ref: "#/components/schemas/SyncCount" }
        auditPending: { $ref: "#/components/schemas/SyncCount" }
        auditFailed: { $ref: "#/components/schemas/SyncCount" }
    TerminalHeartbeatInput:
      type: object
      properties:
        outboxQueueSize: { $ref: "#/components/schemas/SyncCount" }
        peripheralStatus:
          type: object
          additionalProperties: true
          description: Existing native peripheral observations; sync uses PosSyncSnapshot
        syncStatus: { $ref: "#/components/schemas/PosSyncSnapshot" }
    TerminalHeartbeatReceipt:
      type: object
      required: [ok, peripheralConfig]
      properties:
        ok: { type: boolean }
        peripheralConfig: { type: [object, "null"], additionalProperties: true }
    DeviceSyncReport:
      type: object
      required: [terminalId, receivedAt, sync]
      properties:
        terminalId: { type: string, minLength: 1, maxLength: 80 }
        terminalName: { type: string, maxLength: 80 }
        receivedAt: { type: string, maxLength: 40 }
        sync: { $ref: "#/components/schemas/PosSyncSnapshot" }
    DeploymentHeartbeatInput:
      type: object
      properties:
        deploymentId: { type: string, format: uuid }
        backOfficeVersion: { type: [string, "null"], maxLength: 80 }
        posVersion: { type: [string, "null"], maxLength: 80 }
        healthStatus: { type: string, enum: [unknown, healthy, warning, offline, error] }
        healthMessage: { type: [string, "null"], maxLength: 1000 }
        deviceReports:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/DeviceSyncReport" }
    DeploymentHeartbeatReceipt:
      type: object
      required: [ok, deploymentId]
      properties:
        ok: { type: boolean }
        deploymentId: { type: string }
    DeploymentDeviceSyncResponse:
      type: object
      required: [deploymentId, asOf, devices]
      properties:
        deploymentId: { type: string }
        asOf: { type: string }
        lastInstallationHeartbeatAt: { type: [string, "null"] }
        devices:
          type: array
          items: { $ref: "#/components/schemas/DeviceSyncReport" }

