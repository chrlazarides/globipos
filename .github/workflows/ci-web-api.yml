name: CI — Back office and API

on:
  # Always report the required status. Expensive work is gated inside the
  # workflow, not at the trigger, so docs-only PRs do not remain pending.
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: web-api-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Back office / API changes
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      required: ${{ steps.scope.outputs.required }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - name: Detect applicable inputs without installing dependencies
        id: scope
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          DIFF_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node .github/scripts/web-ci-scope.mjs

  web-api:
    name: Back office / API quick gate
    needs: changes
    if: ${{ needs.changes.outputs.required == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      PORT: '5000'
      BASE_PATH: /
      # Only commit IDs, never untrusted PR text interpolated into shell code.
      DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      DIFF_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
          run_install: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Provide disposable API-test PostgreSQL binaries
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v pg_config >/dev/null || [ ! -x "$(pg_config --bindir)/initdb" ]; then
            sudo apt-get update
            sudo apt-get install -y postgresql
          fi
          pg_bin="$(pg_config --bindir)"
          test -x "$pg_bin/initdb"
          printf 'SERVER_TEST_POSTGRES_BIN=%s\n' "$pg_bin" >> "$GITHUB_ENV"
      - name: Check affected Back office / API / library packages
        run: node .github/scripts/web-ci.mjs
      - name: Regenerate OpenAPI client and validators (no database access)
        run: pnpm --filter @workspace/api-spec exec orval --config ./orval.config.ts
      - name: Require committed generated output to match the specification
        shell: bash
        run: |
          changes="$(git status --porcelain --untracked-files=all -- lib/api-client-react/src/generated lib/api-zod/src/generated)"
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            git diff -- lib/api-client-react/src/generated lib/api-zod/src/generated
            echo "::error::OpenAPI output differs. Regenerate and commit the generated client/validators."
            exit 1
          fi

  required-web-api:
    name: Required Back office / API CI
    if: ${{ always() }}
    needs: [changes, web-api]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require success for every applicable check
        shell: bash
        env:
          DETECTION_RESULT: ${{ needs.changes.result }}
          WEB_REQUIRED: ${{ needs.changes.outputs.required }}
          WEB_RESULT: ${{ needs.web-api.result }}
        run: |
          set -euo pipefail
          if [ "$DETECTION_RESULT" != success ]; then
            echo "::error::Change detection did not succeed; applicability is unknown."
            exit 1
          fi
          case "$WEB_REQUIRED" in
            true)
              if [ "$WEB_RESULT" != success ]; then
                echo "::error::Required Back office/API checks did not succeed ($WEB_RESULT)."
                exit 1
              fi
              echo "Applicable Back office/API checks passed."
              ;;
            false)
              if [ "$WEB_RESULT" != skipped ]; then
                echo "::error::Unexpected check state for unrelated changes ($WEB_RESULT)."
                exit 1
              fi
              echo "No Back office/API inputs changed; application checks are not applicable."
              ;;
            *)
              echo "::error::Invalid or missing applicability result."
              exit 1
              ;;
          esac
