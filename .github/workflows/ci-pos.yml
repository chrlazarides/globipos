name: CI — POS Terminal

on:
  push:
    branches: [ main, dev, 'feature/**' ]
    paths:
      - 'pos-app/**'
      - '.github/dependabot.yml'
      - '.github/workflows/build-pos.yml'
      - '.github/workflows/ci-pos.yml'
      - 'scripts/pos-toolchain-config.test.mjs'
      - 'scripts/workflow-test-helpers.mjs'
  pull_request:
    branches: [ main ]
    paths:
      - 'pos-app/**'
      - '.github/dependabot.yml'
      - '.github/workflows/build-pos.yml'
      - '.github/workflows/ci-pos.yml'
      - 'scripts/pos-toolchain-config.test.mjs'
      - 'scripts/workflow-test-helpers.mjs'

concurrency:
  group: ci-pos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  configuration-check:
    name: POS toolchain configuration
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Install workflow configuration parser
        run: npm install --prefix "$RUNNER_TEMP/pos-config-deps" --no-save --package-lock=false --ignore-scripts --registry=https://registry.npmjs.org yaml@2.9.0

      - name: Verify Dependabot and POS CI remain connected
        env:
          NODE_PATH: ${{ runner.temp }}/pos-config-deps/node_modules
        run: npm run test:pos-toolchain-config

  # ── Job 1: Frontend — TypeScript + Vite build ───────────────────────────────
  frontend:
    name: Frontend (TypeScript + Vite)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pos-app/package-lock.json

      - name: Install dependencies
        working-directory: pos-app
        run: npm ci --prefer-offline || npm install

      - name: TypeScript type-check
        working-directory: pos-app
        run: npm run typecheck
        continue-on-error: true  # Report errors but don't block build

      - name: Vite production build
        working-directory: pos-app
        run: npm run build

      - name: Upload frontend dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dist
          path: pos-app/dist/
          retention-days: 3

  # ── Job 2: Rust — check + clippy + format ───────────────────────────────────
  rust-check:
    name: Rust (check + clippy + fmt)
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev

      - name: Install pinned Rust toolchain
        working-directory: pos-app
        run: rustup show active-toolchain

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: './pos-app/src-tauri -> target'

      - name: cargo check
        working-directory: pos-app/src-tauri
        run: cargo check --workspace

      - name: cargo clippy
        working-directory: pos-app/src-tauri
        # Report legacy lint debt without blocking the mandatory compile and smoke-build gates.
        run: cargo clippy --workspace -- -A clippy::too_many_arguments -A clippy::type_complexity

      - name: cargo fmt check
        working-directory: pos-app/src-tauri
        run: cargo fmt --all -- --check

  # ── Job 3: Rust unit tests ───────────────────────────────────────────────────
  rust-test:
    name: Rust (unit tests)
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev

      - name: Install pinned Rust toolchain
        working-directory: pos-app
        run: rustup show active-toolchain

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: './pos-app/src-tauri -> target'

      - name: cargo test (lib unit tests)
        working-directory: pos-app/src-tauri
        run: cargo test --lib -- --nocapture
        env:
          RUST_BACKTRACE: '1'

  # ── Job 4: Desktop platforms — compile with the pinned Rust toolchain ────────
  desktop-platform-check:
    name: Desktop compile (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
          - os: macos-latest
            label: macOS

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pos-app/package-lock.json

      - name: Install pinned Rust toolchain
        working-directory: pos-app
        run: rustup show active-toolchain

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: './pos-app/src-tauri -> target'

      - name: Install frontend dependencies deterministically
        working-directory: pos-app
        run: npm ci

      - name: Compile native Tauri application
        working-directory: pos-app
        run: npx tauri build --no-bundle -- --locked

  # ── Job 5: Smoke build — full compile on Linux, no signing ──────────────────
  smoke-build:
    name: Smoke build (Linux full compile)
    runs-on: ubuntu-22.04
    needs: [ frontend, rust-check, desktop-platform-check ]
    if: always()

    steps:
      - name: Require all compile prerequisites to pass
        run: |
          test '${{ needs.frontend.result }}' = 'success'
          test '${{ needs.rust-check.result }}' = 'success'
          test '${{ needs.desktop-platform-check.result }}' = 'success'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pos-app/package-lock.json

      - name: Install pinned Rust toolchain
        working-directory: pos-app
        run: rustup show active-toolchain

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: './pos-app/src-tauri -> target'

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev

      - name: Install frontend dependencies
        working-directory: pos-app
        run: npm ci --prefer-offline || npm install

      - name: Regenerate icons
        working-directory: pos-app
        run: npx @tauri-apps/cli icon src-tauri/app-icon.png

      - name: Build POS (no bundle — compile only)
        working-directory: pos-app
        run: npx tauri build --no-bundle
        # No TAURI_SIGNING_PRIVATE_KEY → unsigned binary, CI only

      - name: Upload smoke binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pos-smoke-linux
          path: pos-app/src-tauri/target/release/globipos-terminal
          retention-days: 3
          if-no-files-found: warn
