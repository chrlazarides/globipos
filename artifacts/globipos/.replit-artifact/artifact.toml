kind = "web"
previewPath = "/"
title = "GlobiPOS"
description = "GlobiPOS is the back-office application for managing retail inventory, sales, customers, purchasing, accounting, and connected POS operations."
version = "1.0.0"
id = "artifacts/globipos"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26121

[services.development]
run = "pnpm --filter @workspace/globipos run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/globipos", "run", "build" ]
serve = "static"
publicDir = "artifacts/globipos/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26121"
BASE_PATH = "/"
